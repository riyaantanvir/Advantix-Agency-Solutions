<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary Meta -->
    <title>Advantix Agency — Digital Agency in Bangladesh | Web Dev, CRM, Marketing</title>
    <meta name="description" content="Advantix Agency is a full-service digital agency based in Bangladesh. We build custom websites, CRM systems, automation bots, and run Facebook marketing campaigns that grow your business." />
    <meta name="keywords" content="digital agency bangladesh, web development, CRM integration, sales page design, ecommerce, python automation, facebook marketing, social media management, advantix" />
    <meta name="author" content="Advantix Agency" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://advantix.agency/" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Advantix Agency" />
    <meta property="og:title" content="Advantix Agency — Digital Agency in Bangladesh" />
    <meta property="og:description" content="Full-service digital agency: websites, CRM, automation, marketing. Based in Bangladesh, serving clients worldwide." />
    <meta property="og:url" content="https://advantix.agency/" />
    <meta property="og:image" content="https://advantix.agency/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@advantixagency" />
    <meta name="twitter:title" content="Advantix Agency — Digital Agency in Bangladesh" />
    <meta name="twitter:description" content="Full-service digital agency: websites, CRM, automation, marketing. Based in Bangladesh, serving clients worldwide." />
    <meta name="twitter:image" content="https://advantix.agency/images/og-image.png" />

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://advantix.agency/#organization",
      "name": "Advantix Agency",
      "url": "https://advantix.agency",
      "logo": "https://advantix.agency/images/logo-icon.svg",
      "description": "Advantix Agency is a full-service digital agency based in Bangladesh specializing in web development, CRM integration, automation, and digital marketing.",
      "foundingDate": "2022",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "BD",
        "addressLocality": "Bangladesh"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "email": "hello@advantix.agency",
        "availableLanguage": ["English", "Bengali"]
      },
      "sameAs": [
        "https://www.facebook.com/advantixagency",
        "https://twitter.com/advantixagency",
        "https://www.linkedin.com/company/advantixagency"
      ]
    }
    </script>

    <!-- JSON-LD: WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "@id": "https://advantix.agency/#website",
      "url": "https://advantix.agency",
      "name": "Advantix Agency",
      "description": "Full-service digital agency in Bangladesh",
      "publisher": { "@id": "https://advantix.agency/#organization" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://advantix.agency/blog?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
