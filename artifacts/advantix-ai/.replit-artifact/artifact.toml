kind = "web"
previewPath = "/ai/"
title = "Advantix AI"
version = "1.0.0"
id = "artifacts/advantix-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/ai/" ]
localPort = 26083

[services.development]
run = "pnpm --filter @workspace/advantix-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/advantix-ai", "run", "build" ]
publicDir = "artifacts/advantix-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26083"
BASE_PATH = "/ai/"
