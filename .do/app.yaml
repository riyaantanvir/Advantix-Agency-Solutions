# DigitalOcean App Platform Spec
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# HOW TO USE (IMPORTANT):
#   Option A — New app (recommended):
#     1. Push this repo to GitHub
#     2. DigitalOcean App Platform → Create App → GitHub repo
#     3. DO will auto-detect this file and configure correctly
#
#   Option B — Existing app (if auto-detected wrong components):
#     1. Go to your App → Settings → App Spec
#     2. Replace the entire spec with the contents of this file
#     3. Click Save → Deploy
#
#   This config uses ONE Dockerfile-based service that builds and
#   serves ALL frontends (website, admin, AI). Do NOT add separate
#   static site components for each frontend package.
#
# UPLOADS / FILE STORAGE:
#   Blog cover images and other static uploads are BAKED into the Docker image
#   at build time (see Dockerfile: COPY uploads/ ./uploads/).
#   They will always be available immediately after deployment.
#   Files uploaded via the admin panel after deployment will persist until the
#   next redeploy. To make new uploads survive redeploys, upgrade to a
#   Professional instance and add a DO volume at /app/uploads — or configure
#   an S3-compatible object storage (e.g. DO Spaces) for production uploads.

name: advantix-agency
region: sgp1

services:
  - name: web
    dockerfile_path: Dockerfile
    source_dir: /
    github:
      repo: thehiddenlogic01/Advantix-Agency-Solutions
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 30
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 3
    envs:
      - key: DATABASE_URL
        value: ${db.DATABASE_URL}
      - key: SESSION_SECRET
        type: SECRET
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: ADMIN_USERNAME
        value: admin
      # IMPORTANT: Change this to your actual admin password.
      # This value is synced to the DB on every server startup, so changing it
      # here and redeploying immediately updates the production admin password.
      - key: ADMIN_PASSWORD
        value: "2816"
      - key: OPENAI_API_KEY
        type: SECRET
      - key: ANTHROPIC_API_KEY
        type: SECRET
      - key: GEMINI_API_KEY
        type: SECRET
      - key: OPENROUTER_API_KEY
        type: SECRET
      - key: GOOGLE_AI_API_KEY
        type: SECRET
      # Set this to your actual deployed URL (e.g. https://advantix.digital)
      # Used for blog OG tags and email notification links
      - key: SITE_URL
        value: "https://advantix.digital"
      # Restrict CORS to your production domain (comma-separated if multiple)
      # IMPORTANT: Set this to prevent unauthorized cross-origin requests
      - key: ALLOWED_ORIGINS
        value: "https://advantix.digital"

databases:
  - name: db
    engine: PG
    version: "17"
    size: db-s-dev-database
    num_nodes: 1
